info:
  name: Get User By Id
  type: http
  seq: 2

http:
  method: GET
  url: '{{API_URL}}/users/123?name=Samiul&age=28&page=12&limit=13'
  params:
    - name: name
      value: Samiul
      type: query
    - name: age
      value: '28'
      type: query
    - name: page
      value: '12'
      type: query
    - name: limit
      value: '13'
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # GET /users/:id

  Combines a validated path `id` with query fields. `name` and `age` are plain query strings (not DTO-validated). `limit` and `page` go through `ParseIntPipe`.

  ## Mapping
  - Method: GET
  - Route: `/users/:id`
  - Handler: `getUserByIdWithQueryParams`

  ## Path
  | Param | Pipe / DTO | Rules |
  |---|---|---|
  | `id` | `GetUsersParamDto` | Optional on the DTO, required by this route. `@Type(() => Number)` + `@IsInt()`. Non-integers → **400**. |

  ## Query
  | Param | Pipe | Notes |
  |---|---|---|
  | `name` | none | Optional string |
  | `age` | none | Optional string (not `ParseIntPipe`) |
  | `limit` | `DefaultValuePipe(10)`, `ParseIntPipe` | Integer; default 10 |
  | `page` | `DefaultValuePipe(1)`, `ParseIntPipe` | Integer; default 1 |

  ## Success (this request)
  - Status: 200
  - Body (text): `Your user id is: 123, your name is: Samiul, and your age is: 28. Limit: 13, Page: 12`

  ## Server log
  Types: `id` and `limit`/`page` are numbers; `name` and `age` stay strings.
