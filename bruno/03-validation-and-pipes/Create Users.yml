info:
  name: Create Users
  type: http
  seq: 3

http:
  method: POST
  url: '{{API_URL}}/users'
  body:
    type: json
    data: |-
      {
        "name": "test",
        "email": "test@test.com",
        "age": 28,
        "userName": "imSamiul",
        "password": "Test@1234"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # POST /users

  Validates a user payload and returns the serialized body as text.

  ## Controller Mapping
  - Method: POST
  - Route: /users
  - Handler: createUsers(@Body() createUserDto)

  ## Inputs
  - Path params: none
  - Query params: none
  - Body: JSON object

  ## Body Example
  {
    "name": "test",
    "email": "test@test.com",
    "age": 28,
    "password": "Test@1234"
  }

  ## Response
  - Plain string containing the serialized body.

  ## Console Output
  - Logs the validated createUserDto object.

  ## Validation
  - name: required string, 4-20 characters
  - email: required valid email
  - age: required number
  - userName: optional string
  - password: required, at least 8 characters with uppercase, lowercase, number, and special character
  - Unknown properties are rejected by the global validation pipe.
