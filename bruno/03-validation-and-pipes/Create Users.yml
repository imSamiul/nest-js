docs: |-
  # POST /users

  Valid `CreateUserDto`. Global `ValidationPipe` validates, then the handler stringifies the DTO.

  ## Mapping
  - Method: POST
  - Route: `/users`
  - Handler: `createUsers(@Body() createUserDto: CreateUserDto)`

  ## Body (`CreateUserDto`)

  | Field | Required | Rules |
  |---|---|---|
  | `name` | yes | string, not empty, min 4, max 20 |
  | `email` | yes | valid email |
  | `age` | yes | JSON **number** (`IsNumber`). `"28"` as a string fails. |
  | `userName` | no | string if present |
  | `password` | yes | min 8; at least one lowercase, uppercase, digit, and `@$!%*?&` |

  Extra keys → **400** (`forbidNonWhitelisted`).

  ## Success
  - Status: 201
  - Body (text): `This is body: {"name":"test","email":"test@test.com","age":28,"userName":"imSamiul","password":"Test@1234"}`
