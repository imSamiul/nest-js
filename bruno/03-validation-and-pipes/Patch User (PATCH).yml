info:
  name: Patch User (PATCH)
  type: http
  seq: 9

http:
  method: PATCH
  url: '{{API_URL}}/users/123?track=yes'
  params:
    - name: track
      value: yes
      type: query
  body:
    type: json
    data: |-
      {
        "email": "patched@test.com"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # PATCH /users/:id

  Partial update. `PatchUserDto` is `PartialType(CreateUserDto)`: every create field is optional, but a present field must still pass its validators.

  ## Mapping
  - Method: PATCH
  - Route: `/users/:id`
  - Handler: `patchUser(@Param() params, @Query() query, @Body() patchUserDto, @Query('track') track)`

  ## Path
  - `id` via `GetUsersParamDto` (`@IsInt()`, transformed to number)

  ## Query
  - Full object: `@Query()`
  - `track`: optional; this request sends `yes`

  ## Body (`PatchUserDto`)
  Only `email` is sent. `name`, `age`, `password`, `userName` may be omitted. Extra keys → **400**.

  ## Success
  - Status: 200
  - JSON:

  ```json
  {
    "action": "patch",
    "message": "User partially updated",
    "params": { "id": 123 },
    "query": { "track": "yes" },
    "track": "yes",
    "body": { "email": "patched@test.com" }
  }
  ```
