docs: |-
  # GET /users/:id/:optional

  Two path segments. `id` is converted with `ParseIntPipe` (number). `optional` is a raw string.

  ## Mapping
  - Method: GET
  - Route: `/users/:id/:optional`
  - Handler: `getUserByIdWithOptional(@Param('id', ParseIntPipe), @Param('optional'))`

  ## Path
  | Param | Pipe | Rules |
  |---|---|---|
  | `id` | `ParseIntPipe` | Required integer. `abc` → **400**. |
  | `optional` | none | Required for this pattern (example: `profile`). Not actually optional. |

  ## Route matching
  `/users/123` hits `GET :id`. `/users/123/profile` hits this handler. `:optional` is a second required segment, not an optional Nest param.

  ## Success
  - Status: 200
  - Body (text): `Your user id is: 123 and your optional parameter is: profile`

  ## Server log
  `typeof id` is `number`; `typeof optional` is `string`.
