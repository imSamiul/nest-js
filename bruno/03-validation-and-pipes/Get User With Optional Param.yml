info:
  name: Get User With Optional Param
  type: http
  seq: 2

http:
  method: GET
  url: "{{API_URL}}/users/123/profile"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # GET /users/:id/:optional

  Returns a text response using two path params.

  ## Controller Mapping
  - Method: GET
  - Route: /users/:id/:optional
  - Handler: getUserByIdWithOptional(@Param('id'), @Param('optional'))

  ## Inputs
  - Path params:
    - id: required (example: 123)
    - optional: required for this route pattern (example: profile)
  - Query params: none
  - Body: none

  ## Note About Optional Path Param
  - In this current controller, :optional is not optional for this specific route pattern.
  - Optional style usually uses two decorators on one handler:
    - @Get(':id')
    - @Get(':id/:optional')

  ## Response
  - Plain string including id and optional param value.

  ## Console Output
  - Logs id and optional.
