docs: |-
  # GET /users

  Returns the in-memory list. No DTO or pipe on this handler.

  ## Mapping
  - Method: GET
  - Route: `/users`
  - Handler: `getUsers()`

  ## Inputs
  None. A body or query is ignored.

  ## Success
  - Status: 200
  - Body:

  ```json
  [
    { "id": 1, "name": "John Doe" },
    { "id": 2, "name": "Jane Smith" }
  ]
  ```
