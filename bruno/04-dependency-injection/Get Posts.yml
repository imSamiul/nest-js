info:
  name: Get Posts
  type: http
  seq: 3

http:
  method: GET
  url: '{{API_URL}}/posts'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # GET /posts

  Calls `PostsController.findAll()`, which delegates to the injected `PostsService`.

  ## Success
  - Status: 200
  - Body: `This action returns all posts`
